[build-system]
requires = ["hatchling>=1.27", "packaging>=24"]
build-backend = "hatchling.build"

[project]
name = "enterprise-agentic-learning-plane"
version = "0.1.0"
description = "Offline-first, governed enterprise agent runtime, evaluation, optimization, and cloud-readiness labs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.6,<2",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]
cloud = [
  "google-cloud-bigquery>=3.30,<4",
  "google-cloud-pubsub>=2.27,<3",
]

[project.scripts]
learning-plane = "learning_plane.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_plane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

